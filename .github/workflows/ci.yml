name: CI

# Run on every push to main and on PRs touching python / packaging /
# workflow files. Use path filters so doc-only edits don't burn CI minutes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel any in-progress run when a new commit lands on the same ref —
# saves CI minutes on rapid force-pushes and PR update churn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------- #
  # lint + typecheck — fast, no project deps installed
  # ----------------------------------------------------------------------- #
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dev deps
        # --frozen keeps CI honest: if uv.lock is out of date the job
        # fails rather than silently re-resolving.
        run: uv sync --frozen --extra dev
      - name: Ruff (annotations PR-native)
        # --output-format=github emits ::error/::warning annotations that
        # show up directly on PR file diffs and the run summary.
        run: uv run ruff check --output-format=github dbctl tests
      - name: Ruff format check
        run: uv run ruff format --check dbctl tests
      - name: Mypy
        # Non-blocking: the codebase has pre-existing annotation debt that
        # is being paid down incrementally. Remove `continue-on-error`
        # once the count reaches zero.
        run: uv run mypy dbctl
        continue-on-error: true

  # ----------------------------------------------------------------------- #
  # test — matrix across supported Python versions + OSes
  # ----------------------------------------------------------------------- #
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.12" in pyproject.toml
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          # Trim the matrix: skip 3.13 on mac to keep minutes in check
          # (Linux covers the linux/3.13 case).
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        # DB drivers ship as core dependencies; the mssql driver needs
        # ODBC at the system level (libodbc.so), which isn't on these
        # runners by default, but tests don't need it.
        run: uv sync --frozen --extra dev
      - name: Run pytest with coverage
        # --junitxml so failed runs still produce a report artifact;
        # --cov + --cov-report=xml for coverage upload.
        run: |
          mkdir -p reports
          uv run pytest tests/ \
            --junitxml=reports/junit-${{ matrix.os }}-${{ matrix.python-version }}.xml \
            --cov=dbctl \
            --cov-report=xml:reports/coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml \
            --cov-report=term
      - name: Upload test results
        if: always()  # upload even on failure so flaky-test data survives
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        # Codecov works tokenless on public repos via OIDC. On private
        # repos add a CODECOV_TOKEN secret and uncomment `token:`.
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: reports/coverage-${{ matrix.os }}-${{ matrix.python-version }}.xml
          disable_search: true
          fail_ci_if_error: false
          # token: ${{ secrets.CODECOV_TOKEN }}

  # ----------------------------------------------------------------------- #
  # build — wheel + sdist; upload artifact for inspection on every run
  # ----------------------------------------------------------------------- #
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.13
      - name: Build distributions
        run: uv build
      - name: Verify metadata
        run: uv run --with twine twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ----------------------------------------------------------------------- #
  # auto-tag — on a green push to main, tag `v<pyproject version>` if that
  # tag doesn't exist yet. Pushing the tag is meant to trigger a fresh
  # workflow run on `tags: ["v*"]` that re-runs test+build and then gates
  # publish (PyPI) + release (GitHub Release) — this job itself never
  # publishes anything, it only creates the tag. A merge that doesn't bump
  # the version is a no-op here (the tag from the prior bump already
  # exists).
  #
  # IMPORTANT: GitHub does not let a push authenticated with the default
  # `GITHUB_TOKEN` trigger further workflow runs (anti-recursion
  # protection) — a tag pushed with it would NOT fire the `publish`/
  # `release` jobs below. For the auto-tag -> publish -> release chain to
  # actually run end-to-end, add a repo secret `RELEASE_PAT` (a
  # fine-grained PAT, or better, a GitHub App installation token via
  # actions/create-github-app-token, with `contents: write` and
  # `workflows` disabled) and this job will use it. Without that secret,
  # the tag still gets created correctly, it just won't self-trigger —
  # fire publish/release for it manually with:
  #   gh workflow run ci.yml --ref v<version>
  # ----------------------------------------------------------------------- #
  auto-tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # See the IMPORTANT note above: this must be a PAT/App token, not
          # the default GITHUB_TOKEN, for the pushed tag to self-trigger.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create + push tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          if gh api "repos/${{ github.repository }}/git/refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists — skipping (version wasn't bumped)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          if [ "$HAS_RELEASE_PAT" != "true" ]; then
            echo "::notice::Pushed v${VERSION} with the default GITHUB_TOKEN, which does not auto-trigger the publish/release jobs. Add a 'RELEASE_PAT' repo secret so this happens automatically next time, or fire it now with: gh workflow run ci.yml --ref v${VERSION}"
          fi

  # ----------------------------------------------------------------------- #
  # publish — only on a pushed v* tag, gated on test + build
  # ----------------------------------------------------------------------- #
  publish:
    needs: [test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dedicated environment — configure "pypi" under repo settings →
    # Environments with required reviewers/wait-for-approval before the
    # job can publish. PyPI trusted publishing needs id-token: write.
    environment:
      name: pypi
      url: https://pypi.org/p/dbctl
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ----------------------------------------------------------------------- #
  # release — create a GitHub Release from the tagged commit, with
  # auto-generated release notes. Runs after publish so the PyPI link
  # is included in the release body. Only fires on v* tags.
  # ----------------------------------------------------------------------- #
  release:
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write  # needed to create a release
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          # Extract the section between ## [<version>] and the next ## [ or EOF
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk -v ver="## [${VERSION}]" '
            $0 ~ ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          # Save to a file to preserve multiline in the release body
          printf '%s' "$CHANGELOG" > /tmp/release_notes.md
          echo "Got $(wc -l < /tmp/release_notes.md) lines of changelog"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false