[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbctl"
version = "0.7.3"
description = "Generic CLI to monitor, control, and administer multiple databases via SSM, SSH, or direct connection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "dbctl contributors" }]
keywords = ["cli", "database", "postgres", "mysql", "mssql", "oracle", "sqlite", "duckdb", "ssm", "ssh", "tunnel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "click>=8.1",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "sqlalchemy>=2",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "pyodbc>=5",
  "oracledb>=2",
  "duckdb>=1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
dbctl = "dbctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dbctl"]

[tool.hatch.build.targets.wheel.force-include]
"docs/logo.png" = "dbctl/logo.png"
"docs/logo_small.png" = "dbctl/logo_small.png"

# In the sdist, keep the logo at its source path so the wheel built from
# the sdist can still find it via the wheel force-include above.
[tool.hatch.build.targets.sdist.force-include]
"docs/logo.png" = "docs/logo.png"
"docs/logo_small.png" = "docs/logo_small.png"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"