[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbctl"
version = "0.4.0"
description = "Generic CLI to monitor, control, and administer multiple databases via SSM, SSH, or direct connection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dbctl contributors" }]
keywords = ["cli", "database", "postgres", "mysql", "mssql", "ssm", "ssh", "tunnel"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "click>=8.1",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
  "sqlalchemy>=2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql    = ["pymysql>=1.1"]
mssql    = ["pyodbc>=5"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
dbctl = "dbctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dbctl"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B904"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"