# MkDocs config for the GitHub Pages site (see .github/workflows/docs.yml).
#
# The site is built from the existing docs/ folder; the home page is
# generated from the root README.md (docs/index.md) so there is a single
# source of truth. Preview locally with `make docs-serve`.
site_name: dbctl
site_description: >-
  One CLI to monitor, control, and administer many databases — tunnels,
  declared operations, dry-run-first safety gates, and an audit log.
site_url: https://stivio00.github.io/dbctl/
repo_url: https://github.com/stivio00/dbctl
repo_name: stivio00/dbctl
edit_uri: edit/main/docs/

# Internal working notes — never published to the site.
exclude_docs: |
  ACTION_OUTPUT.md
  SESSION_STATE.md

theme:
  name: material
  logo: logo.png
  favicon: logo_small.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - navigation.tracking
    - navigation.footer

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - include-markdown

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - connections.yaml: connections.md
  - operations.yaml: operations.md
  - Ad-hoc SQL (execute): execute.md
  - TUI: tui.md
  - AI: ai.md
  - MCP: mcp.md
  - Design: DESIGN.md
